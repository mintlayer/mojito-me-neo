name: ✨ Feature or screen
description: Propose new UI, or a screen that isn't built yet
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Several screens are known to be unbuilt and may already be claimed. Please check open
        issues first so two people don't build the same thing.

  - type: textarea
    id: what
    attributes:
      label: What should exist?
      description: The user need first, then the proposed UI.
    validations:
      required: true

  - type: textarea
    id: reuse
    attributes:
      label: What can it reuse?
      description: >
        Which existing primitives from `src/ui/index.tsx` does this build on
        (Card, Btn, ListRow, Sheet, PickerSheet, Segmented, …)? Note anything genuinely new.
    validations:
      required: true

  - type: input
    id: design
    attributes:
      label: Design reference
      description: Link to the design source, if one exists.

  - type: checkboxes
    id: offer
    attributes:
      label: Would you like to build it?
      options:
        - label: I'd like to open a PR for this
